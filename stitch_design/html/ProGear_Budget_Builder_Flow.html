<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configurador de Orçamento - Etapa 1: Unidade Móvel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-primary-container": "#fffbff",
            "secondary": "#8b4e3b",
            "surface-dim": "#ecd5cf",
            "surface-variant": "#f5ded7",
            "on-tertiary": "#ffffff",
            "tertiary-fixed": "#bfe9ff",
            "inverse-on-surface": "#ffede8",
            "on-tertiary-container": "#fbfdff",
            "on-tertiary-fixed": "#001f2a",
            "on-primary": "#ffffff",
            "secondary-fixed": "#ffdbd0",
            "secondary-fixed-dim": "#ffb59e",
            "on-secondary-fixed": "#380d02",
            "tertiary": "#006482",
            "outline-variant": "#e0c0b6",
            "on-surface-variant": "#58423b",
            "primary-fixed-dim": "#ffb59e",
            "on-surface": "#251915",
            "tertiary-container": "#007ea3",
            "on-secondary-container": "#783f2d",
            "background": "#fff8f6",
            "error-container": "#ffdad6",
            "surface": "#fff8f6",
            "primary": "#a5360d",
            "surface-tint": "#a8380f",
            "surface-container-highest": "#f5ded7",
            "on-error": "#ffffff",
            "on-primary-fixed": "#3a0b00",
            "on-background": "#251915",
            "secondary-container": "#fdae95",
            "on-tertiary-fixed-variant": "#004d65",
            "on-secondary": "#ffffff",
            "inverse-primary": "#ffb59e",
            "tertiary-fixed-dim": "#6ed2fe",
            "primary-container": "#c74d24",
            "surface-container-high": "#fbe3dd",
            "error": "#ba1a1a",
            "primary-fixed": "#ffdbd0",
            "on-error-container": "#93000a",
            "inverse-surface": "#3b2d29",
            "on-secondary-fixed-variant": "#6f3725",
            "surface-container-low": "#fff1ed",
            "surface-container-lowest": "#ffffff",
            "surface-bright": "#fff8f6",
            "outline": "#8c7169",
            "on-primary-fixed-variant": "#852400",
            "surface-container": "#ffe9e3"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "unit": "4px",
            "stack-xs": "4px",
            "stack-lg": "24px",
            "stack-sm": "8px",
            "gutter-mobile": "12px",
            "margin-mobile": "16px",
            "stack-md": "16px"
          },
          "fontFamily": {
            "body-medium": ["Inter"],
            "step-title": ["Inter"],
            "label-caps": ["Inter"],
            "label-meta": ["Inter"],
            "body": ["Inter"]
          },
          "fontSize": {
            "body-medium": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
            "step-title": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01rem", "fontWeight": "500"}],
            "label-caps": ["11px", {"lineHeight": "14px", "letterSpacing": "0.05rem", "fontWeight": "500"}],
            "label-meta": ["12px", {"lineHeight": "16px", "letterSpacing": "0.01rem", "fontWeight": "400"}],
            "body": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
          }
        }
      }
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-margin-mobile h-14 bg-surface border-b border-outline-variant/30">
<div class="flex items-center gap-stack-md w-full">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-low transition-colors p-2 rounded-full active:scale-95">arrow_back</button>
<h1 class="font-step-title text-step-title text-on-surface">Configurador de Orçamento</h1>
</div>
</header>
<main class="pt-14 pb-40 flex-grow px-margin-mobile">
<!-- Step Indicator -->
<div class="py-stack-lg">
<div class="flex items-center justify-between mb-stack-xs">
<span class="font-label-caps text-label-caps text-secondary uppercase">Etapa 1 de 7</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Unidade Móvel</span>
</div>
<div class="h-1 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-[14.28%]"></div>
</div>
</div>
<!-- Illustrative Canvas -->
<section class="mb-stack-lg">
<div class="w-full aspect-[16/9] border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest overflow-hidden relative">
<!-- Placeholder State -->
<div class="flex flex-col items-center text-center p-stack-lg">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-outline text-4xl">precision_manufacturing</span>
</div>
<p class="font-body-medium text-body-medium text-on-surface-variant">Selecione sua unidade para começar a montagem</p>
</div>
<!-- Subtle Gradient Overlay -->
<div class="absolute inset-0 pointer-events-none bg-gradient-to-t from-surface-container-low/20 to-transparent"></div>
</div>
</section>
<!-- Selection Grid -->
<section class="grid grid-cols-1 gap-stack-md">
<h2 class="font-step-title text-step-title text-on-surface mb-stack-xs">Escolha a Infraestrutura</h2>
<!-- Option 1 -->
<button class="flex items-center justify-between p-stack-md bg-surface-container-lowest border-[0.5px] border-outline-variant/50 rounded-xl hover:bg-surface-container-low transition-colors group text-left">
<div class="flex items-center gap-stack-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-lg">
<span class="material-symbols-outlined text-secondary">airport_shuttle</span>
</div>
<div>
<p class="font-body-medium text-body-medium text-on-surface">Rack em Van 6U</p>
<p class="font-label-meta text-label-meta text-on-surface-variant">Solução logística compacta</p>
</div>
</div>
<div class="text-right">
<p class="font-body-medium text-body-medium text-primary">R$ 1.500</p>
</div>
</button>
<!-- Option 2 -->
<button class="flex items-center justify-between p-stack-md bg-surface-container-lowest border-[0.5px] border-outline-variant/50 rounded-xl hover:bg-surface-container-low transition-colors group text-left">
<div class="flex items-center gap-stack-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-lg">
<span class="material-symbols-outlined text-secondary">local_shipping</span>
</div>
<div>
<p class="font-body-medium text-body-medium text-on-surface">Rack em Caminhão 12U</p>
<p class="font-label-meta text-label-meta text-on-surface-variant">Unidade profissional média</p>
</div>
</div>
<div class="text-right">
<p class="font-body-medium text-body-medium text-primary">R$ 3.200</p>
</div>
</button>
<!-- Option 3 -->
<button class="flex items-center justify-between p-stack-md bg-surface-container-lowest border-[0.5px] border-outline-variant/50 rounded-xl hover:bg-surface-container-low transition-colors group text-left">
<div class="flex items-center gap-stack-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-lg">
<span class="material-symbols-outlined text-secondary">rv_hookup</span>
</div>
<div>
<p class="font-body-medium text-body-medium text-on-surface">Unidade Móvel OB Van 24U</p>
<p class="font-label-meta text-label-meta text-on-surface-variant">Estação de broadcast completa</p>
</div>
</div>
<div class="text-right">
<p class="font-body-medium text-body-medium text-primary">R$ 7.500</p>
</div>
</button>
</section>
</main>
<!-- Sticky Footer -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface border-t border-outline-variant/50 flex flex-col p-stack-md gap-stack-sm shadow-lg">
<!-- Active Selections Chips (Empty State) -->
<div class="flex gap-stack-sm overflow-x-auto pb-stack-xs">
<div class="px-3 py-1.5 rounded-full border-[0.5px] border-dashed border-outline-variant text-on-surface-variant text-[11px] font-medium flex items-center gap-1 shrink-0">
<span class="material-symbols-outlined text-[14px]">add</span>
        Nenhuma unidade selecionada
      </div>
</div>
<!-- Summary & CTA -->
<div class="flex items-center justify-between gap-stack-md">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Subtotal</p>
<p class="font-step-title text-step-title text-on-surface">R$ 0,00</p>
</div>
<button class="flex-grow max-w-[200px] h-12 bg-outline-variant text-on-primary font-body-medium rounded-lg opacity-50 cursor-not-allowed flex items-center justify-center gap-2" disabled="">
        Próximo
        <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</footer>
<!-- Background Decorative Image (Hidden/Soft) -->
<div class="fixed inset-0 -z-10 opacity-[0.03] pointer-events-none overflow-hidden">
<img alt="Visão aérea limpa de equipamentos de câmera profissional e artes de produção organizados em uma superfície neutra clara." class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDF1yKdzgZtKVcB7EHtMDNZNTqJWzhbSJLOadZDTpN0_p8VFDd7OWbDadMjMB4WCsHI-UJLUL33IGd83usgDMWBSVeHnWRyc5eL_cTg0zsr5oOEw5BrNutpfd11Zy_XD854o7US76k9XsNn1mG-YTA6nLvCA9RQqzrQkKKyrHzeLB9D1y8_vfzVouCthpPh4Av0lIxDM-OYzrZnt1bBNOIy_BMPBRmi1XZzYIv8apmdkvwvaERQ-eL5c1by_RREupOtsiBSvCJDeuH2"/>
</div>
